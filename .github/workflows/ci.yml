name: Verify Gamio
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gamio
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: gamio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gamio"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://gamio:integration-only@localhost:5432/gamio
      PUBLIC_ORIGIN: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm --prefix frontend run build
      - run: npm --prefix backend test
      - run: npm --prefix backend run seed
      - name: API and browser tests
        run: |
          npm --prefix backend start > /tmp/gamio-api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/health && break || sleep 1; done
          npm --prefix backend run test:integration
          npm install --prefix /tmp/gamio-browser --no-save playwright
          /tmp/gamio-browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/gamio-browser/node_modules/playwright/index.mjs node scripts/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: /tmp/gamio-browser-results
